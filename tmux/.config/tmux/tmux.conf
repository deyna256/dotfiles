# ---- Prefix ----
set -g prefix C-Space
unbind C-b
bind-key C-Space send-prefix

# ---- Core behaviour ----
# tmux runs $SHELL as a login shell by default, so every new pane re-runs
# /etc/profile (169ms here, almost all of it vapoursynth's profile.d hook).
# The server already inherited that environment from the shell that started it.
set -g default-command "${SHELL}"
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -s set-clipboard on
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
# Lets Kitty graphics through, which is how yazi previews images.
set -g allow-passthrough on
setw -g mode-keys vi

# ---- Copy mode ----
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ---- Splits & windows (preserve cwd) ----
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# ---- Status bar ----
set -g status-left-length 40
set -g status-right-length 40
set -g status-left " #S "
set -g status-right " %H:%M "

# ---- Plugins (TPM) ----
# tmux-sensible dropped: overrides the modern terminal settings set above.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'

# ---- Config management ----
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

run '~/.config/tmux/plugins/tpm/tpm'
